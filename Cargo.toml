[workspace]
members = ["crates/oxr-runtime", "crates/oxr-cli"]
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/fusor-rs/oxr-wasm"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# fusor-ai, from crates.io. vendor/fusor-ai, the same release, supplies the browser host
# scripts, the runtime build and the import check.
bundle = { package = "fusor-ai-bundle", version = "=0.1.2" }
compile = { package = "fusor-ai-compile", version = "=0.1.2" }
oxr = { package = "fusor-ai-oxr", version = "=0.1.2" }
oxr-compile = { package = "fusor-ai-oxr-compile", version = "=0.1.2" }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
getrandom = "=0.3.4"
wasm-bindgen = "=0.2.129"
wasm-bindgen-rayon = { version = "=1.3.0", features = ["no-bundler"] }
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }

# The unreleased fusor-ai change OXR needs (the oxr model and compiler, the Qwen3 layer, Pillow's
# bilinear resize and PyTorch's bicubic grid resampling), from the fusor-ai checkout of its `oxr`
# branch at ~/workspace/andreespirela/fusor-ai-oxr.
[patch.crates-io]
fusor-ai-team = { path = "../fusor-ai-oxr/crates/team" }
fusor-ai-kernels = { path = "../fusor-ai-oxr/crates/kernels" }
fusor-ai-blocks = { path = "../fusor-ai-oxr/crates/blocks" }
fusor-ai-bundle = { path = "../fusor-ai-oxr/crates/bundle" }
fusor-ai-compile = { path = "../fusor-ai-oxr/crates/compile" }
fusor-ai-oxr = { path = "../fusor-ai-oxr/crates/models/oxr" }
fusor-ai-oxr-compile = { path = "../fusor-ai-oxr/crates/models/oxr-compile" }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
# The kernels are unusably slow unoptimised; optimise them even in dev builds.
opt-level = 3
debug = false

[profile.release]
debug = false

# Browser runtimes (vendor/fusor-ai/scripts/build-runtime.sh): speed, fat LTO for size, abort on panic.
[profile.wasm]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
